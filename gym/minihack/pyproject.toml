[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "minihack-levels"
version = "0.1.0"
description = "Navigation and river planning levels built on MiniHack."
requires-python = ">=3.10"
dependencies = ["minihack", "nle>=1.3", "numpy", "setuptools<81"]

[tool.setuptools]
packages = ["minihack_levels"]

[tool.setuptools.package-data]
minihack_levels = ["layouts.json"]
